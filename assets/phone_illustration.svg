  <path d="M40 250C40 250 35 245 30 245C25 245 20 248 20 253C20 260 40 270 40 270C40 270 60 260 60 253C60 248 55 245 50 245C45 245 40 250 40 250Z" fill="#D946A6" opacity="0.7"/>

